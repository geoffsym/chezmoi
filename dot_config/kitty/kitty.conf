# --- GENERAL SETTINGS ---


# --- MAPPINGS ---
map f11 toggle_fullscreen

# Send raw legacy Ctrl+Space (\x00) followed by Ctrl+q (\x11) to shpool so detach
# works even in TUI applications that enable the Kitty keyboard protocol (e.g. Neovim, Antigravity CLI).
# Upstream issue: https://github.com/shell-pool/shpool/issues/71
map ctrl+space>ctrl+q send_text all \x00\x11


# BEGIN_KITTY_THEME
# Leaf Dark
include current-theme.conf
# END_KITTY_THEME

# BEGIN_KITTY_FONTS
font_family      family="FiraCode Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12
# END_KITTY_FONTS
