# Extended keys to hush pi warnings
# TODO is this needed?
#set -g extended-keys on
#set -g extended-keys-format csi-u

# Generated by tmux.app Config Generator
# https://tmux.app/#config-generator

# ── Prefix Key ──────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── General Settings ─────────────────────
set -g mouse on

# ── Mouse & Selection ─────────────────────
# Don't auto-copy on drag release
unbind -T copy-mode MouseDragEnd1Pane
bind-key -T copy-mode C-S-c send-keys -X copy-pipe-no-clear

set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Open splits in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Reload config keybind
bind r source-file ~/.config/tmux/tmux.conf \; display-message "✅ Config reloaded!"

# ── Status Bar ────────────────────────────
set -g status-position top
set -g status-interval 5
# Customize status-left / status-right for themepack
set -g @theme-status-left " #S "
set -g @theme-status-right " %H:%M "

# ── Terminal Colors ──────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# ── Theme (via TPM) ──────────────────────
set -g @plugin 'jimeh/tmux-themepack'
set -g @themepack 'basic'

# ── TPM Plugin Manager ───────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
