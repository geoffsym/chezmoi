[cursor.style]
"blinking" = "On"

[env]
TERM = "xterm-256color"

[font]
size = 14

[font.bold]
family = "FiraCode Nerd Font"
style = "Bold"

[font.bold_italic]
family = "FiraCode Nerd Font"
style = "Bold Italic"

[font.italic]
family = "FiraCode Nerd Font"
style = "Italic"

[font.normal]
family = "FiraCode Nerd Font"
style = "Regular"

[general]
live_config_reload = true

[[keyboard.bindings]]
key = "F11"
action = "ToggleFullscreen"

[mouse]
hide_when_typing = true

[[mouse.bindings]]
mouse = "Middle"
action = "None"

[scrolling]
history = 100000

[window]
startup_mode = "Maximized"
decorations = "full"
dynamic_padding = true

[window.padding]
x = 6
y = 6
